<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F6F3EC;
    --paper-raised:#FFFFFF;
    --ink:#1C2032;
    --ink-soft:#5B5F73;
    --line:rgba(28,32,50,0.10);
    --line-strong:rgba(28,32,50,0.18);

    --accent:#E5197F;      /* marca / creativo */
    --accent-ink:#7A0E45;
    --blue:#2D5BFF;        /* paid media */
    --teal:#00A896;        /* audiovisual */
    --amber:#F2994A;       /* automatizaciones */

    --pend:#B9BCC9;        /* por hacer */
    --proc:#2D5BFF;        /* en proceso */
    --rev:#F2994A;         /* revision */
    --done:#00A896;        /* terminado */

    --danger:#E4482D;
  }

  *{box-sizing:border-box;}
  #panel-root{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--paper);
    min-height:100%;
    padding:28px 28px 60px;
    -webkit-font-smoothing:antialiased;
  }
  #panel-root h1,#panel-root h2,#panel-root h3,#panel-root .display{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:-0.01em;
  }
  #panel-root .mono{
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.02em;
  }

  /* ---------- header ---------- */
  .pm-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:26px;
    padding-bottom:22px;
    border-bottom:2px solid var(--ink);
  }
  .pm-header .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent-ink);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .pm-header .eyebrow::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }
  .pm-header h1{
    font-size:30px;
    font-weight:700;
    margin:0;
  }
  .pm-header .sub{
    color:var(--ink-soft);
    font-size:14px;
    margin-top:4px;
  }
  .pm-stats{
    display:flex;
    gap:22px;
  }
  .pm-stat{
    text-align:right;
  }
  .pm-stat .n{
    font-family:'Space Grotesk',sans-serif;
    font-size:26px;
    font-weight:700;
    line-height:1;
  }
  .pm-stat .l{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-top:3px;
  }
  .pm-stat.warn .n{color:var(--danger);}

  /* ---------- overview strip (matrix summary cards) ---------- */
  .pm-team-strip{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:26px;
  }
  @media (max-width:900px){ .pm-team-strip{grid-template-columns:repeat(2,1fr);} }
  .pm-person-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px 14px;
    border-top:3px solid var(--pc-color, var(--ink));
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .pm-person-card:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(28,32,50,0.08); }
  .pm-person-card.active{ box-shadow:0 0 0 2px var(--pc-color, var(--ink)) inset; }
  .pm-person-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pm-avatar{
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
    color:#fff;
    flex-shrink:0;
  }
  .pm-person-name{ font-weight:600; font-size:14px; line-height:1.2;}
  .pm-person-role{ font-size:11.5px; color:var(--ink-soft); }
  .pm-person-count{
    font-family:'Space Grotesk',sans-serif;
    font-size:20px;font-weight:700;
    margin-bottom:8px;
  }
  .pm-person-count span{ font-size:11px; font-weight:500; color:var(--ink-soft); font-family:'Inter',sans-serif;}
  .pm-track{
    display:flex; height:6px; border-radius:4px; overflow:hidden; background:var(--line);
  }
  .pm-track div{ height:100%; }

  /* ---------- toolbar ---------- */
  .pm-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:18px;
  }
  .pm-filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .pm-chip{
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    padding:6px 13px;
    border-radius:100px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;
  }
  .pm-chip.on{ background:var(--ink); color:#fff; border-color:var(--ink);}
  .pm-chip .dot{ width:8px;height:8px;border-radius:50%; }

  .pm-view-toggle{ display:flex; border:1px solid var(--line-strong); border-radius:10px; overflow:hidden;}
  .pm-view-toggle button{
    border:none; background:var(--paper-raised); padding:8px 16px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft);
  }
  .pm-view-toggle button.on{ background:var(--ink); color:#fff; }

  .pm-actions{ display:flex; gap:10px; }
  .pm-btn{
    border:none; border-radius:10px; padding:10px 18px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .pm-btn.primary{ background:var(--ink); color:#fff; }
  .pm-btn.primary:hover{ background:#000; }
  .pm-btn.ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line-strong); }
  .pm-search{
    border:1px solid var(--line-strong); border-radius:10px; padding:9px 14px;
    font-family:'Inter',sans-serif; font-size:13px; background:var(--paper-raised); min-width:180px;
  }
  .pm-search:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  /* ---------- board ---------- */
  .pm-board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    align-items:start;
  }
  @media (max-width:900px){ .pm-board{grid-template-columns:1fr;} }
  .pm-col{
    background:rgba(28,32,50,0.03);
    border-radius:14px;
    padding:14px;
    min-height:120px;
  }
  .pm-col-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .pm-col-title{
    font-weight:700; font-size:13.5px;
    display:flex; align-items:center; gap:8px;
  }
  .pm-col-title .dot{ width:9px;height:9px;border-radius:50%; }
  .pm-col-count{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px; color:var(--ink-soft);
    background:var(--paper-raised);
    border-radius:100px; padding:2px 8px;
  }
  .pm-empty-col{
    font-size:12px; color:var(--ink-soft); text-align:center; padding:20px 8px; border:1.5px dashed var(--line-strong); border-radius:10px;
  }

  /* ---------- task card ---------- */
  .pm-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px 12px;
    margin-bottom:10px;
    cursor:pointer;
    border-left:4px solid var(--card-color, var(--ink));
    transition:box-shadow .12s ease, transform .12s ease;
  }
  .pm-card:hover{ box-shadow:0 8px 20px rgba(28,32,50,0.10); transform:translateY(-1px); }
  .pm-card-top{ display:flex; justify-content:space-between; gap:8px; margin-bottom:6px;}
  .pm-card-title{ font-weight:600; font-size:13.5px; line-height:1.35;}
  .pm-prio{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:2px 7px; border-radius:100px; height:fit-content; white-space:nowrap;
  }
  .pm-prio.alta{ background:rgba(228,72,45,0.12); color:var(--danger); }
  .pm-prio.media{ background:rgba(242,153,74,0.15); color:#a15a1c; }
  .pm-prio.baja{ background:rgba(0,168,150,0.12); color:#046d61; }

  .pm-card-desc{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  .pm-card-bottom{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .pm-card-person{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .pm-mini-avatar{
    width:20px;height:20px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;
    display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk',sans-serif;
  }
  .pm-due{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); }
  .pm-due.overdue{ color:var(--danger); font-weight:700; }

  /* 4-step progress tracker (signature element) */
  .pm-tracker{ display:flex; align-items:center; margin-top:10px; }
  .pm-tracker .seg{ flex:1; height:3px; background:var(--line); position:relative; }
  .pm-tracker .seg.filled{ background:var(--card-color, var(--ink)); }
  .pm-tracker .node{
    width:7px;height:7px;border-radius:50%; background:var(--line); flex-shrink:0; z-index:1;
    border:1.5px solid var(--paper-raised);
  }
  .pm-tracker .node.filled{ background:var(--card-color, var(--ink)); }

  /* ---------- matrix view ---------- */
  .pm-matrix{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  table.pm-matrix-table{ width:100%; border-collapse:collapse; }
  table.pm-matrix-table th{
    text-align:left; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);
    padding:12px 14px; border-bottom:2px solid var(--ink); background:rgba(28,32,50,0.02);
  }
  table.pm-matrix-table th:first-child{ width:210px; }
  table.pm-matrix-table td{
    padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top;
  }
  table.pm-matrix-table tr:last-child td{ border-bottom:none; }
  .pm-matrix-person{ display:flex; align-items:center; gap:10px; }
  .pm-matrix-progress{ margin-top:8px; }
  .pm-matrix-progress .pm-track{ height:5px; }
  .pm-matrix-progress .pct{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-soft); margin-top:4px;}
  .pm-matrix-cell-chips{ display:flex; flex-direction:column; gap:6px; }
  .pm-matrix-chip{
    font-size:11.5px; font-weight:600; padding:5px 9px; border-radius:8px;
    background:rgba(28,32,50,0.045); cursor:pointer; border-left:3px solid var(--chip-color,var(--ink));
  }
  .pm-matrix-chip:hover{ background:rgba(28,32,50,0.09); }
  .pm-matrix-empty{ font-size:11px; color:#B9BCC9; font-style:italic; }

  /* ---------- time insights (avg duration patterns) ---------- */
  .pm-insights{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    padding:20px 22px; margin-top:16px;
  }
  .pm-insights-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .pm-insights-head h3{ font-size:15px; margin:0; }
  .pm-insights-head .sub2{ font-size:11.5px; color:var(--ink-soft); }
  .pm-insight-callout{
    font-size:12.5px; color:var(--accent-ink); background:rgba(229,25,127,0.06);
    border-radius:9px; padding:9px 12px; margin:12px 0 18px; font-weight:600; line-height:1.5;
  }
  .pm-insight-grid{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  @media (max-width:800px){ .pm-insight-grid{ grid-template-columns:1fr; } }
  .pm-insight-col-title{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:12px;
  }
  .pm-insight-row{ display:flex; align-items:center; gap:10px; margin-bottom:11px; }
  .pm-insight-row .lbl{ width:112px; flex-shrink:0; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .pm-insight-row .track{ flex:1; height:8px; border-radius:5px; background:var(--line); overflow:hidden; }
  .pm-insight-row .fill{ height:100%; border-radius:5px; }
  .pm-insight-row .val{ width:74px; flex-shrink:0; text-align:right; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .pm-insights-empty{ font-size:12px; color:var(--ink-soft); font-style:italic; }

  /* ---------- modal ---------- */
  .pm-overlay{
    position:fixed; inset:0; background:rgba(20,20,30,0.45);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .pm-modal{
    background:var(--paper-raised); border-radius:16px; width:100%; max-width:440px;
    padding:26px; max-height:90vh; overflow-y:auto;
  }
  .pm-modal h3{ font-size:19px; margin:0 0 18px; }
  .pm-field{ margin-bottom:14px; }
  .pm-field label{
    display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--ink-soft); margin-bottom:6px;
  }
  .pm-field label .who{
    text-transform:none; font-weight:600; letter-spacing:0; color:var(--accent-ink); font-size:11px;
  }
  .pm-field input[type=text], .pm-field textarea, .pm-field select, .pm-field input[type=date]{
    width:100%; border:1px solid var(--line-strong); border-radius:9px; padding:9px 11px;
    font-family:'Inter',sans-serif; font-size:13.5px; background:var(--paper); color:var(--ink);
  }
  .pm-field textarea{ resize:vertical; min-height:60px; }
  .pm-field input:focus, .pm-field textarea:focus, .pm-field select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .pm-row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pm-avatar-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .pm-avatar-picker .opt{
    display:flex; align-items:center; gap:7px; border:1.5px solid var(--line-strong); border-radius:100px;
    padding:5px 11px 5px 5px; cursor:pointer; font-size:12px; font-weight:600;
  }
  .pm-avatar-picker .opt.sel{ border-color:var(--ink); background:rgba(28,32,50,0.04); }
  .pm-modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}

  /* ---------- attachments ---------- */
  .pm-dropzone{
    border:1.5px dashed var(--line-strong); border-radius:10px; padding:14px;
    text-align:center; cursor:pointer; font-size:12.5px; color:var(--ink-soft); font-weight:600;
    transition:border-color .12s ease, background .12s ease;
  }
  .pm-dropzone:hover, .pm-dropzone.drag{ border-color:var(--accent); background:rgba(229,25,127,0.04); color:var(--accent-ink); }
  .pm-dropzone .hint{ font-weight:400; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .pm-attach-list{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .pm-attach-chip{
    display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:9px;
    padding:7px 10px; font-size:12px; background:var(--paper);
  }
  .pm-attach-chip .clip{ flex-shrink:0; opacity:0.6; }
  .pm-attach-chip .name{ flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .pm-attach-chip .name:hover{ text-decoration:underline; color:var(--accent-ink); }
  .pm-attach-chip .size{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--ink-soft); }
  .pm-attach-chip .rm{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:15px; line-height:1; padding:0 2px; }
  .pm-attach-chip .rm:hover{ color:var(--danger); }
  .pm-card-attach{ display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-soft); font-weight:600; }

  .pm-alert-badge{
    display:flex; align-items:center; gap:3px; font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:100px; background:rgba(228,72,45,0.12); color:var(--danger);
    white-space:nowrap;
  }
  .pm-alert-badge.done{ background:rgba(28,32,50,0.06); color:var(--ink-soft); }
  .pm-alert-badge.pulse{ animation:pm-pulse 1.8s ease-in-out infinite; }
  .pm-alert-badge.risk{ background:rgba(242,153,74,0.16); color:#a15a1c; }
  .pm-alert-badge + .pm-alert-badge{ margin-top:6px; }
  @keyframes pm-pulse{ 0%,100%{opacity:1;} 50%{opacity:0.55;} }
  .pm-gantt-bar.overrun{ box-shadow:0 0 0 2px var(--danger), 0 2px 5px rgba(0,0,0,0.12); }
  .pm-matrix-chip.overrun{ border-left-color:var(--danger) !important; }
  .pm-matrix-chip .alert-icon{ margin-right:3px; }

  /* ---------- calendar / gantt view ---------- */
  .pm-cal-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .pm-cal-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; text-transform:capitalize; }
  .pm-cal-nav{ display:flex; align-items:center; gap:8px; }
  .pm-cal-nav button{
    border:1px solid var(--line-strong); background:var(--paper-raised); border-radius:8px; width:30px; height:30px;
    cursor:pointer; font-size:14px; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .pm-cal-nav button:hover{ background:rgba(28,32,50,0.05); }
  .pm-cal-nav .today-btn{ width:auto; padding:0 12px; font-size:12px; font-weight:600; font-family:'Inter',sans-serif; }

  .pm-gantt-wrap{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:14px;
    overflow-x:auto; overflow-y:hidden;
  }
  .pm-gantt-inner{ min-width:max-content; }
  .pm-gantt-header{ display:flex; border-bottom:2px solid var(--ink); position:sticky; top:0; background:var(--paper-raised); z-index:3; }
  .pm-gantt-label-col{
    width:220px; flex-shrink:0; position:sticky; left:0; background:var(--paper-raised);
    z-index:4; border-right:1px solid var(--line-strong);
    display:flex; align-items:flex-end; padding:8px 12px; font-size:10.5px; color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.06em;
  }
  .pm-gantt-day{
    width:34px; flex-shrink:0; text-align:center; padding:6px 0; font-size:10.5px; color:var(--ink-soft);
  }
  .pm-gantt-day .wd{ font-family:'JetBrains Mono',monospace; font-size:9px; text-transform:uppercase; opacity:0.7; }
  .pm-gantt-day .dn{ font-weight:700; font-size:12.5px; color:var(--ink); margin-top:1px; }
  .pm-gantt-day.weekend{ background:rgba(28,32,50,0.035); }
  .pm-gantt-day.today .dn{ color:#fff; background:var(--accent); border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; margin:1px auto 0; }

  .pm-gantt-row{ display:flex; border-bottom:1px solid var(--line); }
  .pm-gantt-row:last-child{ border-bottom:none; }
  .pm-gantt-row-label{
    width:220px; flex-shrink:0; position:sticky; left:0; background:var(--paper-raised); z-index:2;
    border-right:1px solid var(--line-strong); padding:10px 12px; display:flex; align-items:center; gap:8px;
    cursor:pointer;
  }
  .pm-gantt-row-label .t{ font-size:12px; font-weight:600; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .pm-gantt-track{ position:relative; display:flex; padding:9px 0; }
  .pm-gantt-cellbg{ width:34px; flex-shrink:0; }
  .pm-gantt-cellbg.weekend{ background:rgba(28,32,50,0.03); }
  .pm-gantt-bar{
    position:absolute; top:8px; height:22px; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; padding:0 8px; overflow:hidden;
    font-size:10.5px; font-weight:700; color:#fff; white-space:nowrap;
    box-shadow:0 2px 5px rgba(0,0,0,0.12);
  }
  .pm-gantt-bar .lbl{ overflow:hidden; text-overflow:ellipsis; }
  .pm-gantt-today-line{ position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:1; opacity:0.55; }
  .pm-cal-empty{ padding:50px 20px; text-align:center; color:var(--ink-soft); font-size:13px; }
  .pm-cal-legend{ display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
  .pm-cal-legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .pm-cal-legend-item .sw{ width:10px; height:10px; border-radius:3px; }

  .pm-toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:100px; font-size:13px; font-weight:600;
    z-index:80; box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
</style>

<div id="panel-root">
  <div id="pm-app"></div>
</div>

<script>
(function(){

  var TEAM = [
    {id:'cc', name:'Carlos Cascante', role:'Estrategia Paid Media', color:'var(--blue)', hex:'#2D5BFF', initials:'CC'},
    {id:'cf', name:'Carlos Fernández', role:'Dirección Creativa', color:'var(--accent)', hex:'#E5197F', initials:'CF'},
    {id:'ac', name:'Andrés Calderón', role:'Producción Audiovisual', color:'var(--teal)', hex:'#00A896', initials:'AC'},
    {id:'db', name:'Daniel Brenes', role:'Automatizaciones', color:'var(--amber)', hex:'#F2994A', initials:'DB'},
  ];

  var STATUSES = [
    {id:'pendiente', label:'Por hacer', hex:'#B9BCC9', order:0},
    {id:'proceso', label:'En proceso', hex:'#2D5BFF', order:1},
    {id:'revision', label:'En revisión', hex:'#F2994A', order:2},
    {id:'terminado', label:'Terminado', hex:'#00A896', order:3},
  ];

  var STORAGE_KEY = 'tasks-v1';
  var SETTINGS_KEY = 'settings-v1';
  var MAX_FILE_BYTES = 3.2 * 1024 * 1024; // keep base64'd size safely under the 5MB per-key storage limit
  var DAY_W = 34; // px, must match .pm-gantt-day / .pm-gantt-cellbg width in CSS

  var state = {
    tasks: [],
    loaded: false,
    view: 'board', // board | matrix
    filterPerson: null,
    search: '',
    modalOpen: false,
    editingTask: null, // null = new
    toast: null,
    pendingAttachments: [], // {id, name, size, type, dataUrl?, isNew}
    removedAttachmentIds: [],
    calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    settings: {alta:3, media:5, baja:8},
    settingsModalOpen: false,
  };

  function uid(){ return 't' + Math.random().toString(36).slice(2,10); }
  function personOf(id){ return TEAM.find(function(p){return p.id===id;}); }
  function statusOf(id){ return STATUSES.find(function(s){return s.id===id;}); }
  function esc(str){ return (str||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtDate(d){
    if(!d) return '';
    var dt = new Date(d+'T00:00:00');
    var months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return dt.getDate()+' '+months[dt.getMonth()];
  }
  function toISODate(dt){
    var y=dt.getFullYear(), m=('0'+(dt.getMonth()+1)).slice(-2), d=('0'+dt.getDate()).slice(-2);
    return y+'-'+m+'-'+d;
  }
  function isOverdue(t){
    if(!t.due || t.status==='terminado') return false;
    var today = new Date(); today.setHours(0,0,0,0);
    return new Date(t.due+'T00:00:00') < today;
  }
  function showToast(msg){
    state.toast = msg;
    render();
    setTimeout(function(){ state.toast = null; render(); }, 2200);
  }
  function fmtBytes(n){
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return Math.round(n/1024) + ' KB';
    return (n/(1024*1024)).toFixed(1) + ' MB';
  }
  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(new Error('No se pudo leer el archivo')); };
      reader.readAsDataURL(file);
    });
  }
  function triggerDownload(dataUrl, name){
    var a = document.createElement('a');
    a.href = dataUrl;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // ---------- storage ----------
  async function init(){
    await Promise.all([loadTasks(), loadSettings()]);
    state.loaded = true;
    render();
  }
  async function loadTasks(){
    try{
      var res = await window.storage.get(STORAGE_KEY, true);
      state.tasks = res && res.value ? JSON.parse(res.value) : seedTasks();
    }catch(e){
      state.tasks = seedTasks();
    }
  }
  async function saveTasks(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.tasks), true);
    }catch(e){
      showToast('No se pudo guardar. Intenta de nuevo.');
    }
  }
  async function loadSettings(){
    try{
      var res = await window.storage.get(SETTINGS_KEY, true);
      state.settings = res && res.value ? JSON.parse(res.value) : {alta:3, media:5, baja:8};
    }catch(e){
      state.settings = {alta:3, media:5, baja:8};
    }
  }
  async function saveSettings(){
    try{
      await window.storage.set(SETTINGS_KEY, JSON.stringify(state.settings), true);
    }catch(e){
      showToast('No se pudo guardar la configuración.');
    }
  }
  function seedTasks(){
    var today = new Date();
    function addDays(n){ var d=new Date(today); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
    return [
      {id:uid(), title:'Campaña de retargeting Q3', desc:'Configurar públicos y presupuesto diario en Meta Ads.', assignee:'cc', status:'proceso', priority:'alta', start:addDays(-1), due:addDays(2), estDuration:6},
      {id:uid(), title:'Guion para reel de producto', desc:'Guion de 30s para el lanzamiento de la línea nueva.', assignee:'cf', status:'pendiente', priority:'media', start:addDays(3), due:addDays(5), estDuration:3},
      {id:uid(), title:'Grabación testimonios clientes', desc:'Coordinar locación y equipo de cámara.', assignee:'ac', status:'revision', priority:'alta', start:addDays(-3), due:addDays(1), estDuration:5},
      {id:uid(), title:'Flujo de bienvenida por WhatsApp', desc:'Automatizar secuencia de 4 mensajes post-registro.', assignee:'db', status:'proceso', priority:'media', start:addDays(0), due:addDays(4), estDuration:4},
      {id:uid(), title:'Reporte mensual de rendimiento', desc:'Consolidar métricas de todas las cuentas activas.', assignee:'cc', status:'terminado', priority:'baja', start:addDays(-6), due:addDays(-1), estDuration:6},
      {id:uid(), title:'Moodboard campaña navideña', desc:'', assignee:'cf', status:'proceso', priority:'baja', start:addDays(6), due:addDays(9), estDuration:3},
    ];
  }

  // ---------- derived data ----------
  function filteredTasks(){
    return state.tasks.filter(function(t){
      if(state.filterPerson && t.assignee !== state.filterPerson) return false;
      if(state.search && t.title.toLowerCase().indexOf(state.search.toLowerCase())===-1) return false;
      return true;
    });
  }
  function tasksOf(personId, statusId){
    return state.tasks.filter(function(t){ return t.assignee===personId && t.status===statusId; });
  }
  function progressPct(t){
    var idx = statusOf(t.status).order;
    return Math.round((idx/(STATUSES.length-1))*100);
  }
  function personProgress(personId){
    var tasks = state.tasks.filter(function(t){return t.assignee===personId;});
    if(tasks.length===0) return 0;
    var sum = tasks.reduce(function(acc,t){ return acc + progressPct(t); }, 0);
    return Math.round(sum/tasks.length);
  }

  // ---------- render helpers ----------
  function renderTracker(t){
    var idx = statusOf(t.status).order;
    var segs = '';
    for(var i=0;i<STATUSES.length;i++){
      segs += '<div class="node '+(i<=idx?'filled':'')+'" style="--card-color:'+personOf(t.assignee).hex+'"></div>';
      if(i<STATUSES.length-1){
        segs += '<div class="seg '+(i<idx?'filled':'')+'" style="--card-color:'+personOf(t.assignee).hex+'"></div>';
      }
    }
    return '<div class="pm-tracker">'+segs+'</div>';
  }

  // Compares the collaborator's estimated duration against the lead's deadline.
  function planRisk(t){
    if(!t.start || !t.estDuration || !t.due) return null;
    var start = new Date(t.start+'T00:00:00');
    var estFinish = new Date(start);
    estFinish.setDate(estFinish.getDate() + (parseInt(t.estDuration,10)-1));
    var due = new Date(t.due+'T00:00:00');
    if(estFinish <= due) return null;
    var overBy = Math.round((estFinish-due)/86400000);
    return {estFinish: estFinish, overBy: overBy};
  }

  function taskDurationDays(t){
    if(!t.start || !t.due) return null;
    var s = new Date(t.start+'T00:00:00'), d = new Date(t.due+'T00:00:00');
    var n = Math.round((d-s)/86400000) + 1;
    return n > 0 ? n : null;
  }

  // Real execution days: start -> due if finished, start -> today if still active.
  function execDaysOf(t){
    if(!t.start) return null;
    var start = new Date(t.start+'T00:00:00');
    var endRef = (t.status==='terminado' && t.due) ? new Date(t.due+'T00:00:00') : new Date();
    endRef.setHours(0,0,0,0);
    var n = Math.floor((endRef-start)/86400000)+1;
    return n>0 ? n : 1;
  }

  // Flags tasks whose real execution time (start -> today, or start -> due if finished)
  // has run past the expected duration for their priority level.
  function timeAlertInfo(t){
    if(!t.start) return null;
    var threshold = state.settings[t.priority] || 5;
    var start = new Date(t.start+'T00:00:00');
    var endRef = t.status==='terminado' && t.due ? new Date(t.due+'T00:00:00') : new Date();
    endRef.setHours(0,0,0,0);
    var elapsed = Math.floor((endRef-start)/86400000) + 1;
    if(elapsed < 1) elapsed = 1;
    if(elapsed <= threshold) return null;
    return {elapsed:elapsed, threshold:threshold, finished: t.status==='terminado'};
  }

  function renderCard(t){
    var p = personOf(t.assignee);
    var overdue = isOverdue(t);
    var dur = taskDurationDays(t);
    var alert = timeAlertInfo(t);
    var risk = planRisk(t);
    return ''+
      '<div class="pm-card" style="--card-color:'+p.hex+'" data-open-task="'+t.id+'">'+
        '<div class="pm-card-top">'+
          '<div class="pm-card-title">'+esc(t.title)+'</div>'+
          '<div class="pm-prio '+t.priority+'">'+t.priority+'</div>'+
        '</div>'+
        (t.desc ? '<div class="pm-card-desc">'+esc(t.desc)+'</div>' : '')+
        (alert ? '<div class="pm-alert-badge '+(alert.finished?'done':'pulse')+'" title="Duró '+alert.elapsed+' días, se esperaban '+alert.threshold+'">⏱ '+alert.elapsed+'d de '+alert.threshold+'d '+(alert.finished?'(cerrada tarde)':'estimados')+'</div>' : '')+
        (risk ? '<div class="pm-alert-badge risk" title="La duración estimada por el colaborador termina '+risk.overBy+' día(s) después de la fecha límite del líder">⚠ estimado supera fecha límite por '+risk.overBy+'d</div>' : '')+
        '<div class="pm-card-bottom">'+
          '<div class="pm-card-person"><div class="pm-mini-avatar" style="background:'+p.hex+'">'+p.initials+'</div>'+p.name.split(' ')[0]+'</div>'+
          '<div style="display:flex;align-items:center;gap:8px;">'+
            (t.attachments && t.attachments.length ? '<div class="pm-card-attach">📎 '+t.attachments.length+'</div>' : '')+
            (t.estDuration ? '<div class="pm-card-attach">est. '+t.estDuration+'d</div>' : (dur ? '<div class="pm-card-attach">'+dur+'d</div>' : ''))+
            (t.due ? '<div class="pm-due '+(overdue?'overdue':'')+'">'+(overdue?'⚠ ':'')+fmtDate(t.due)+'</div>' : '')+
          '</div>'+
        '</div>'+
        renderTracker(t)+
      '</div>';
  }

  function renderTeamStrip(){
    return TEAM.map(function(p){
      var tasks = state.tasks.filter(function(t){return t.assignee===p.id;});
      var active = tasks.filter(function(t){return t.status!=='terminado';}).length;
      var byStatus = STATUSES.map(function(s){
        var count = tasks.filter(function(t){return t.status===s.id;}).length;
        return {s:s, count:count};
      });
      var total = tasks.length || 1;
      var bars = byStatus.map(function(b){
        var w = (b.count/total)*100;
        if(w===0) return '';
        return '<div style="width:'+w+'%;background:'+b.s.hex+'"></div>';
      }).join('');
      return ''+
        '<div class="pm-person-card '+(state.filterPerson===p.id?'active':'')+'" style="--pc-color:'+p.hex+'" data-filter-person="'+p.id+'">'+
          '<div class="pm-person-top">'+
            '<div class="pm-avatar" style="background:'+p.hex+'">'+p.initials+'</div>'+
            '<div><div class="pm-person-name">'+p.name+'</div><div class="pm-person-role">'+p.role+'</div></div>'+
          '</div>'+
          '<div class="pm-person-count">'+active+' <span>activa'+(active===1?'':'s')+' · '+tasks.length+' total</span></div>'+
          '<div class="pm-track">'+bars+'</div>'+
        '</div>';
    }).join('');
  }

  function renderBoard(){
    var tasks = filteredTasks();
    return '<div class="pm-board">'+ STATUSES.map(function(s){
      var col = tasks.filter(function(t){return t.status===s.id;});
      return ''+
        '<div class="pm-col">'+
          '<div class="pm-col-head">'+
            '<div class="pm-col-title"><span class="dot" style="background:'+s.hex+'"></span>'+s.label+'</div>'+
            '<div class="pm-col-count">'+col.length+'</div>'+
          '</div>'+
          (col.length ? col.map(renderCard).join('') : '<div class="pm-empty-col">Sin tareas aquí</div>')+
        '</div>';
    }).join('') + '</div>';
  }

  function renderMatrix(){
    var rows = TEAM.map(function(p){
      var cells = STATUSES.map(function(s){
        var items = tasksOf(p.id, s.id);
        var chips = items.map(function(t){
          var alert = timeAlertInfo(t);
          return '<div class="pm-matrix-chip '+(alert?'overrun':'')+'" style="--chip-color:'+s.hex+'" data-open-task="'+t.id+'" title="'+(alert?('Lleva '+alert.elapsed+' días, se esperaban '+alert.threshold):'')+'">'+(alert?'<span class="alert-icon">⏱</span>':'')+esc(t.title)+'</div>';
        }).join('');
        return '<td>'+(items.length ? '<div class="pm-matrix-cell-chips">'+chips+'</div>' : '<span class="pm-matrix-empty">—</span>')+'</td>';
      }).join('');
      var pct = personProgress(p.id);
      return ''+
        '<tr>'+
          '<td>'+
            '<div class="pm-matrix-person">'+
              '<div class="pm-avatar" style="background:'+p.hex+';width:30px;height:30px;font-size:11px;">'+p.initials+'</div>'+
              '<div><div style="font-weight:600;font-size:13px;">'+p.name+'</div><div style="font-size:11px;color:var(--ink-soft);">'+p.role+'</div></div>'+
            '</div>'+
            '<div class="pm-matrix-progress">'+
              '<div class="pm-track"><div style="width:'+pct+'%;background:'+p.hex+'"></div></div>'+
              '<div class="pct">'+pct+'% del avance promedio</div>'+
            '</div>'+
          '</td>'+
          cells+
        '</tr>';
    }).join('');
    return ''+
      '<div class="pm-matrix">'+
        '<table class="pm-matrix-table">'+
          '<thead><tr><th>Persona</th>'+STATUSES.map(function(s){return '<th>'+s.label+'</th>';}).join('')+'</tr></thead>'+
          '<tbody>'+rows+'</tbody>'+
        '</table>'+
      '</div>'+
      renderTimeInsights();
  }

  function renderTimeInsights(){
    var withExec = state.tasks.filter(function(t){ return execDaysOf(t)!==null; });
    if(!withExec.length){
      return '<div class="pm-insights"><div class="pm-insights-head"><h3>Tiempos promedio</h3></div><div class="pm-insights-empty">Agrega fechas de inicio a las tareas para ver los promedios de tiempo por persona y por prioridad.</div></div>';
    }

    function groupAvg(items, keyFn){
      var buckets = {};
      items.forEach(function(t){
        var k = keyFn(t);
        if(!buckets[k]) buckets[k] = {sum:0, count:0};
        buckets[k].sum += execDaysOf(t);
        buckets[k].count += 1;
      });
      return buckets;
    }

    var byPerson = groupAvg(withExec, function(t){ return t.assignee; });
    var personRows = TEAM.map(function(p){
      var b = byPerson[p.id];
      return {label:p.name.split(' ')[0], color:p.hex, avg: b ? b.sum/b.count : 0, count: b ? b.count : 0};
    }).filter(function(r){ return r.count>0; }).sort(function(a,b){ return b.avg-a.avg; });

    var prioColors = {alta:'var(--danger)', media:'#a15a1c', baja:'#046d61'};
    var byPrio = groupAvg(withExec, function(t){ return t.priority; });
    var prioRows = ['alta','media','baja'].map(function(pr){
      var b = byPrio[pr];
      return {label:pr.charAt(0).toUpperCase()+pr.slice(1), color:prioColors[pr], avg: b ? b.sum/b.count : 0, count: b ? b.count : 0};
    }).filter(function(r){ return r.count>0; }).sort(function(a,b){ return b.avg-a.avg; });

    var maxVal = Math.max.apply(null, personRows.concat(prioRows).map(function(r){return r.avg;}).concat([1]));

    function renderRows(rows){
      return rows.map(function(r){
        var w = Math.max(6, Math.round((r.avg/maxVal)*100));
        return ''+
          '<div class="pm-insight-row">'+
            '<div class="lbl"><span style="width:8px;height:8px;border-radius:50%;background:'+r.color+';display:inline-block;flex-shrink:0;"></span>'+esc(r.label)+'</div>'+
            '<div class="track"><div class="fill" style="width:'+w+'%;background:'+r.color+'"></div></div>'+
            '<div class="val">'+r.avg.toFixed(1)+'d · '+r.count+'t</div>'+
          '</div>';
      }).join('');
    }

    var callout = '';
    if(personRows.length>1){
      var slowest = personRows[0];
      var teamAvg = personRows.reduce(function(a,r){return a+r.avg;},0)/personRows.length;
      if(slowest.avg > teamAvg*1.15){
        callout = '💡 <strong>'+esc(slowest.label)+'</strong> tiene el promedio más alto ('+slowest.avg.toFixed(1)+' días), por encima del promedio del equipo ('+teamAvg.toFixed(1)+' días). Puede valer la pena revisar su carga o el tipo de tareas que recibe.';
      }
    }
    if(!callout && prioRows.length>1){
      var slowP = prioRows[0];
      callout = '💡 Las tareas de prioridad <strong>'+esc(slowP.label.toLowerCase())+'</strong> son las que más tardan en promedio ('+slowP.avg.toFixed(1)+' días).';
    }

    return ''+
      '<div class="pm-insights">'+
        '<div class="pm-insights-head"><h3>Tiempos promedio</h3><span class="sub2">· patrones del equipo</span></div>'+
        (callout ? '<div class="pm-insight-callout">'+callout+'</div>' : '')+
        '<div class="pm-insight-grid">'+
          '<div><div class="pm-insight-col-title">Promedio por persona</div>'+renderRows(personRows)+'</div>'+
          '<div><div class="pm-insight-col-title">Promedio por prioridad</div>'+renderRows(prioRows)+'</div>'+
        '</div>'+
      '</div>';
  }

  function renderCalendar(){
    var year = state.calendarMonth.getFullYear();
    var month = state.calendarMonth.getMonth();
    var nDays = new Date(year, month+1, 0).getDate();
    var monthFirst = new Date(year, month, 1);
    var monthLast = new Date(year, month, nDays);
    var today = new Date(); today.setHours(0,0,0,0);
    var isCurrentMonth = (today.getFullYear()===year && today.getMonth()===month);
    var weekdays = ['dom','lun','mar','mié','jue','vie','sáb'];
    var monthLabel = monthFirst.toLocaleDateString('es-ES', {month:'long', year:'numeric'});

    var dayHeaders = '';
    for(var d=1; d<=nDays; d++){
      var dow = new Date(year, month, d).getDay();
      var weekend = (dow===0 || dow===6);
      var isToday = isCurrentMonth && d===today.getDate();
      dayHeaders += '<div class="pm-gantt-day '+(weekend?'weekend':'')+' '+(isToday?'today':'')+'">'+
        '<div class="wd">'+weekdays[dow]+'</div><div class="dn">'+d+'</div></div>';
    }

    var tasks = filteredTasks().filter(function(t){ return t.start || t.due; });
    tasks.sort(function(a,b){
      var sa = a.start || a.due, sb = b.start || b.due;
      return sa < sb ? -1 : sa > sb ? 1 : 0;
    });

    var rows = tasks.map(function(t){
      var p = personOf(t.assignee);
      var sDate = new Date((t.start || t.due)+'T00:00:00');
      var eDate = new Date((t.due || t.start)+'T00:00:00');
      if(eDate < sDate){ var tmp=sDate; sDate=eDate; eDate=tmp; }
      if(eDate < monthFirst || sDate > monthLast) return ''; // not visible this month

      var continuesBefore = sDate < monthFirst;
      var continuesAfter = eDate > monthLast;
      var clipStart = continuesBefore ? monthFirst : sDate;
      var clipEnd = continuesAfter ? monthLast : eDate;
      var startDay = clipStart.getDate();
      var endDay = clipEnd.getDate();
      var leftPx = (startDay-1) * DAY_W + 3;
      var widthPx = (endDay - startDay + 1) * DAY_W - 6;
      var totalDays = Math.round((eDate - sDate)/86400000) + 1;

      var cellsBg = '';
      for(var d2=1; d2<=nDays; d2++){
        var dow2 = new Date(year, month, d2).getDay();
        cellsBg += '<div class="pm-gantt-cellbg '+((dow2===0||dow2===6)?'weekend':'')+'"></div>';
      }
      var todayLine = isCurrentMonth ? '<div class="pm-gantt-today-line" style="left:'+((today.getDate()-1)*DAY_W + DAY_W/2)+'px"></div>' : '';
      var alert = timeAlertInfo(t);

      return ''+
        '<div class="pm-gantt-row">'+
          '<div class="pm-gantt-row-label" data-open-task="'+t.id+'">'+
            '<div class="pm-mini-avatar" style="background:'+p.hex+';flex-shrink:0;">'+p.initials+'</div>'+
            '<div class="t">'+esc(t.title)+'<div style="font-weight:400;color:var(--ink-soft);font-size:10.5px;margin-top:2px;">'+totalDays+' día'+(totalDays===1?'':'s')+(alert?' · ⏱ excede estimado':'')+'</div></div>'+
          '</div>'+
          '<div class="pm-gantt-track">'+cellsBg+todayLine+
            '<div class="pm-gantt-bar '+(alert?'overrun':'')+'" data-open-task="'+t.id+'" style="left:'+leftPx+'px;width:'+widthPx+'px;background:'+p.hex+'; '+
              (continuesBefore?'border-top-left-radius:0;border-bottom-left-radius:0;':'')+
              (continuesAfter?'border-top-right-radius:0;border-bottom-right-radius:0;':'')+'">'+
              '<span class="lbl">'+(alert?'⏱ ':'')+esc(t.title)+'</span>'+
            '</div>'+
          '</div>'+
        '</div>';
    }).join('');

    if(!rows.trim()){
      rows = '<div class="pm-cal-empty">No hay tareas con fechas en '+monthLabel+'.</div>';
    }

    var legend = TEAM.map(function(p){
      return '<div class="pm-cal-legend-item"><span class="sw" style="background:'+p.hex+'"></span>'+p.name.split(' ')[0]+'</div>';
    }).join('');

    return ''+
      '<div class="pm-cal-head">'+
        '<div class="pm-cal-title">'+monthLabel+'</div>'+
        '<div class="pm-cal-nav">'+
          '<button data-cal-nav="-1" title="Mes anterior">‹</button>'+
          '<button class="today-btn" data-cal-nav="0">Hoy</button>'+
          '<button data-cal-nav="1" title="Mes siguiente">›</button>'+
        '</div>'+
      '</div>'+
      '<div class="pm-gantt-wrap">'+
        '<div class="pm-gantt-inner" style="width:'+(220 + nDays*DAY_W)+'px">'+
          '<div class="pm-gantt-header">'+
            '<div class="pm-gantt-label-col">Tarea</div>'+
            dayHeaders+
          '</div>'+
          rows+
        '</div>'+
      '</div>'+
      '<div class="pm-cal-legend">'+legend+'</div>';
  }

  function renderAttachList(){
    if(!state.pendingAttachments.length) return '';
    return state.pendingAttachments.map(function(a){
      return ''+
        '<div class="pm-attach-chip">'+
          '<span class="clip">📎</span>'+
          '<span class="name" data-download-attach="'+a.id+'" title="Descargar '+esc(a.name)+'">'+esc(a.name)+'</span>'+
          '<span class="size">'+fmtBytes(a.size)+'</span>'+
          '<button type="button" class="rm" data-remove-attach="'+a.id+'" title="Quitar">✕</button>'+
        '</div>';
    }).join('');
  }

  function renderExecTimeInfo(t){
    if(!t.start) return '';
    var alert = timeAlertInfo(t);
    var dur = taskDurationDays(t);
    var today = new Date(); today.setHours(0,0,0,0);
    var start = new Date(t.start+'T00:00:00');
    var elapsed = Math.floor((today-start)/86400000)+1; if(elapsed<1) elapsed=1;
    var line = t.status==='terminado'
      ? 'Tiempo de ejecución: '+(dur||elapsed)+' días (de '+fmtDate(t.start)+' a '+fmtDate(t.due||t.start)+').'
      : 'Lleva '+elapsed+' día'+(elapsed===1?'':'s')+' en curso'+(t.due?(', vence el '+fmtDate(t.due)):'')+'.';
    return ''+
      '<div style="display:flex;align-items:center;gap:8px;background:'+(alert?'rgba(228,72,45,0.08)':'rgba(28,32,50,0.04)')+';border-radius:9px;padding:9px 12px;margin:-4px 0 14px;font-size:12px;color:'+(alert?'var(--danger)':'var(--ink-soft)')+';font-weight:600;">'+
        (alert?'⏱ ':'⏳ ')+line+(alert?(' Se esperaban '+alert.threshold+' días para prioridad '+t.priority+'.'):'')+
      '</div>';
  }

  function renderPlanRiskInfo(t){
    var risk = planRisk(t);
    if(!risk){
      if(t.start && t.estDuration && t.due){
        return '<div style="display:flex;align-items:center;gap:8px;background:rgba(0,168,150,0.08);border-radius:9px;padding:9px 12px;margin:-4px 0 14px;font-size:12px;color:#046d61;font-weight:600;">✅ La duración estimada por el colaborador encaja dentro de la fecha límite del líder.</div>';
      }
      return '';
    }
    return ''+
      '<div style="display:flex;align-items:center;gap:8px;background:rgba(242,153,74,0.14);border-radius:9px;padding:9px 12px;margin:-4px 0 14px;font-size:12px;color:#a15a1c;font-weight:600;">'+
        '⚠ Con la duración que puso el colaborador, la tarea terminaría el '+fmtDate(toISODate(risk.estFinish))+', '+risk.overBy+' día'+(risk.overBy===1?'':'s')+' después de la fecha límite del líder.'+
      '</div>';
  }

  function renderModal(){
    if(!state.modalOpen) return '';
    var editing = state.editingTask;
    var t = editing || {title:'', desc:'', assignee:TEAM[0].id, status:'pendiente', priority:'media', start:'', due:''};
    return ''+
      '<div class="pm-overlay" data-close-modal="1">'+
        '<div class="pm-modal" onclick="event.stopPropagation()">'+
          '<h3>'+(editing? 'Editar tarea' : 'Nueva tarea')+'</h3>'+
          '<div class="pm-field"><label>Título</label><input type="text" id="pm-f-title" value="'+esc(t.title)+'" placeholder="Ej. Preparar reporte semanal"></div>'+
          '<div class="pm-field"><label>Descripción (opcional)</label><textarea id="pm-f-desc" placeholder="Detalles, links, contexto...">'+esc(t.desc)+'</textarea></div>'+
          '<div class="pm-field"><label>Responsable</label><div class="pm-avatar-picker" id="pm-f-assignee" data-value="'+t.assignee+'">'+
            TEAM.map(function(p){
              return '<div class="opt '+(p.id===t.assignee?'sel':'')+'" data-person="'+p.id+'">'+
                '<div class="pm-mini-avatar" style="background:'+p.hex+'">'+p.initials+'</div>'+p.name.split(' ')[0]+'</div>';
            }).join('')+
          '</div></div>'+
          '<div class="pm-row2">'+
            '<div class="pm-field"><label>Estado</label><select id="pm-f-status">'+
              STATUSES.map(function(s){return '<option value="'+s.id+'" '+(s.id===t.status?'selected':'')+'>'+s.label+'</option>';}).join('')+
            '</select></div>'+
            '<div class="pm-field"><label>Prioridad</label><select id="pm-f-priority">'+
              ['alta','media','baja'].map(function(p){return '<option value="'+p+'" '+(p===t.priority?'selected':'')+'>'+p.charAt(0).toUpperCase()+p.slice(1)+'</option>';}).join('')+
            '</select></div>'+
          '</div>'+
          '<div class="pm-row2">'+
            '<div class="pm-field"><label>Inicio</label><input type="date" id="pm-f-start" value="'+(t.start||'')+'"></div>'+
            '<div class="pm-field"><label>Duración estimada <span class="who">· colaborador</span></label><input type="text" inputmode="numeric" id="pm-f-estdur" placeholder="días" value="'+(t.estDuration||'')+'"></div>'+
          '</div>'+
          '<div class="pm-field">'+
            '<label>Fecha límite <span class="who">· líder</span></label>'+
            '<input type="date" id="pm-f-due" value="'+(t.due||'')+'">'+
            '<div class="hint" style="margin-top:5px;">El líder define esta fecha; puede ser independiente de la duración que estime el colaborador.</div>'+
          '</div>'+
          (editing ? renderExecTimeInfo(t) : '')+
          (editing ? renderPlanRiskInfo(t) : '')+
          '<div class="pm-field">'+
            '<label>Adjuntos</label>'+
            '<div class="pm-dropzone" id="pm-dropzone">'+
              '📎 Haz clic para adjuntar archivos'+
              '<div class="hint">Máx. ~3 MB por archivo</div>'+
            '</div>'+
            '<input type="file" id="pm-f-file" multiple style="display:none">'+
            '<div class="pm-attach-list" id="pm-attach-list">'+ renderAttachList() +'</div>'+
          '</div>'+
          '<div class="pm-modal-actions">'+
            (editing ? '<button class="pm-btn ghost" id="pm-delete" style="color:var(--danger);border-color:var(--danger);">Eliminar</button>' : '<span></span>')+
            '<div style="display:flex;gap:8px;">'+
              '<button class="pm-btn ghost" data-close-modal="1">Cancelar</button>'+
              '<button class="pm-btn primary" id="pm-save">'+(editing?'Guardar cambios':'Crear tarea')+'</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>';
  }

  function renderSettingsModal(){
    if(!state.settingsModalOpen) return '';
    var s = state.settings;
    return ''+
      '<div class="pm-overlay" data-close-settings="1">'+
        '<div class="pm-modal" style="max-width:380px;" onclick="event.stopPropagation()">'+
          '<h3>Umbrales de tiempo</h3>'+
          '<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;">'+
            'Si una tarea activa lleva más días desde su inicio que el umbral de su prioridad, se marca con la alerta ⏱ de tiempo excedido.'+
          '</div>'+
          '<div class="pm-field"><label>Prioridad alta — días esperados</label><input type="text" inputmode="numeric" id="pm-th-alta" value="'+s.alta+'"></div>'+
          '<div class="pm-field"><label>Prioridad media — días esperados</label><input type="text" inputmode="numeric" id="pm-th-media" value="'+s.media+'"></div>'+
          '<div class="pm-field"><label>Prioridad baja — días esperados</label><input type="text" inputmode="numeric" id="pm-th-baja" value="'+s.baja+'"></div>'+
          '<div class="pm-modal-actions">'+
            '<span></span>'+
            '<div style="display:flex;gap:8px;">'+
              '<button class="pm-btn ghost" data-close-settings="1">Cancelar</button>'+
              '<button class="pm-btn primary" id="pm-save-settings">Guardar</button>'+
            '</div>'+
          '</div>'+
        '</div>'+
      '</div>';
  }

  function render(){
    var app = document.getElementById('pm-app');
    if(!state.loaded){
      app.innerHTML = '<div style="padding:60px;text-align:center;color:var(--ink-soft);font-size:13px;">Cargando el panel del equipo…</div>';
      return;
    }
    var total = state.tasks.length;
    var active = state.tasks.filter(function(t){return t.status!=='terminado';}).length;
    var overdue = state.tasks.filter(isOverdue).length;
    var timeAlerts = state.tasks.filter(function(t){ return t.status!=='terminado' && timeAlertInfo(t); }).length;

    var html = ''+
      '<div class="pm-header">'+
        '<div>'+
          '<div class="eyebrow">Marketing Digital · Equipo</div>'+
          '<h1>Panel de Tareas</h1>'+
          '<div class="sub">Qué está haciendo cada persona, en qué status va cada tarea y cuánto tiempo lleva.</div>'+
        '</div>'+
        '<div class="pm-stats">'+
          '<div class="pm-stat"><div class="n">'+total+'</div><div class="l">Tareas totales</div></div>'+
          '<div class="pm-stat"><div class="n">'+active+'</div><div class="l">En curso</div></div>'+
          '<div class="pm-stat '+(overdue?'warn':'')+'"><div class="n">'+overdue+'</div><div class="l">Atrasadas</div></div>'+
          '<div class="pm-stat '+(timeAlerts?'warn':'')+'"><div class="n">'+timeAlerts+'</div><div class="l">Tiempo excedido</div></div>'+
          '<button class="pm-btn ghost" id="pm-open-settings" title="Configurar umbrales de tiempo" style="align-self:flex-end;">⚙︎</button>'+
        '</div>'+
      '</div>'+

      '<div class="pm-team-strip">'+renderTeamStrip()+'</div>'+

      '<div class="pm-toolbar">'+
        '<div class="pm-filters">'+
          '<div class="pm-chip '+(!state.filterPerson?'on':'')+'" data-filter-person="">Todos</div>'+
          TEAM.map(function(p){
            return '<div class="pm-chip '+(state.filterPerson===p.id?'on':'')+'" data-filter-person="'+p.id+'"><span class="dot" style="background:'+p.hex+'"></span>'+p.name.split(' ')[0]+'</div>';
          }).join('')+
          '<input class="pm-search" id="pm-search" placeholder="Buscar tarea…" value="'+esc(state.search)+'">'+
        '</div>'+
        '<div class="pm-actions">'+
          '<div class="pm-view-toggle">'+
            '<button class="'+(state.view==='board'?'on':'')+'" data-view="board">Tablero</button>'+
            '<button class="'+(state.view==='matrix'?'on':'')+'" data-view="matrix">Matriz</button>'+
            '<button class="'+(state.view==='calendar'?'on':'')+'" data-view="calendar">Calendario</button>'+
          '</div>'+
          '<button class="pm-btn primary" id="pm-new-task">+ Nueva tarea</button>'+
        '</div>'+
      '</div>'+

      (state.view==='board' ? renderBoard() : state.view==='matrix' ? renderMatrix() : renderCalendar())+
      renderModal()+
      renderSettingsModal()+
      (state.toast ? '<div class="pm-toast">'+esc(state.toast)+'</div>' : '');

    app.innerHTML = html;
    bindEvents();
  }

  async function handleFiles(fileList){
    var files = Array.prototype.slice.call(fileList || []);
    for(var i=0;i<files.length;i++){
      var f = files[i];
      if(f.size > MAX_FILE_BYTES){
        showToast('"'+f.name+'" pesa demasiado (máx. ~3 MB).');
        continue;
      }
      try{
        var dataUrl = await readFileAsDataUrl(f);
        state.pendingAttachments.push({
          id: uid(), name: f.name, size: f.size, type: f.type, dataUrl: dataUrl, isNew: true
        });
        render();
      }catch(e){
        showToast('No se pudo leer "'+f.name+'".');
      }
    }
  }

  // ---------- events ----------
  function bindEvents(){
    var app = document.getElementById('pm-app');

    app.querySelectorAll('[data-filter-person]').forEach(function(el){
      el.addEventListener('click', function(){
        var val = el.getAttribute('data-filter-person');
        state.filterPerson = (val==='' ) ? null : (state.filterPerson===val ? null : val);
        render();
      });
    });

    app.querySelectorAll('[data-view]').forEach(function(el){
      el.addEventListener('click', function(){ state.view = el.getAttribute('data-view'); render(); });
    });

    app.querySelectorAll('[data-cal-nav]').forEach(function(el){
      el.addEventListener('click', function(){
        var dir = el.getAttribute('data-cal-nav');
        if(dir==='0'){
          state.calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
        } else {
          var d = state.calendarMonth;
          state.calendarMonth = new Date(d.getFullYear(), d.getMonth()+parseInt(dir,10), 1);
        }
        render();
      });
    });

    var searchEl = document.getElementById('pm-search');
    if(searchEl){
      searchEl.addEventListener('input', function(){ state.search = searchEl.value; render(); });
      // restore cursor focus after re-render
      searchEl.focus();
      var v = searchEl.value; searchEl.value=''; searchEl.value=v;
    }

    var newBtn = document.getElementById('pm-new-task');
    if(newBtn) newBtn.addEventListener('click', function(){
      state.editingTask=null;
      state.pendingAttachments = [];
      state.removedAttachmentIds = [];
      state.modalOpen=true;
      render();
    });

    app.querySelectorAll('[data-open-task]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-open-task');
        state.editingTask = state.tasks.find(function(t){return t.id===id;});
        state.pendingAttachments = (state.editingTask.attachments || []).map(function(a){
          return {id:a.id, name:a.name, size:a.size, type:a.type, isNew:false};
        });
        state.removedAttachmentIds = [];
        state.modalOpen = true;
        render();
      });
    });

    app.querySelectorAll('[data-close-modal]').forEach(function(el){
      el.addEventListener('click', function(){ state.modalOpen=false; state.editingTask=null; render(); });
    });

    var openSettings = document.getElementById('pm-open-settings');
    if(openSettings) openSettings.addEventListener('click', function(){ state.settingsModalOpen = true; render(); });

    app.querySelectorAll('[data-close-settings]').forEach(function(el){
      el.addEventListener('click', function(){ state.settingsModalOpen = false; render(); });
    });

    var saveSettingsBtn = document.getElementById('pm-save-settings');
    if(saveSettingsBtn){
      saveSettingsBtn.addEventListener('click', function(){
        function clean(v, fallback){ var n = parseInt(v,10); return (isFinite(n) && n>0) ? n : fallback; }
        state.settings = {
          alta: clean(document.getElementById('pm-th-alta').value, state.settings.alta),
          media: clean(document.getElementById('pm-th-media').value, state.settings.media),
          baja: clean(document.getElementById('pm-th-baja').value, state.settings.baja),
        };
        state.settingsModalOpen = false;
        showToast('Umbrales actualizados');
        render();
        saveSettings();
      });
    }

    var picker = document.getElementById('pm-f-assignee');
    if(picker){
      picker.querySelectorAll('[data-person]').forEach(function(opt){
        opt.addEventListener('click', function(){
          picker.setAttribute('data-value', opt.getAttribute('data-person'));
          picker.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});
          opt.classList.add('sel');
        });
      });
    }

    var dropzone = document.getElementById('pm-dropzone');
    var fileInput = document.getElementById('pm-f-file');
    if(dropzone && fileInput){
      dropzone.addEventListener('click', function(){ fileInput.click(); });
      dropzone.addEventListener('dragover', function(e){ e.preventDefault(); dropzone.classList.add('drag'); });
      dropzone.addEventListener('dragleave', function(){ dropzone.classList.remove('drag'); });
      dropzone.addEventListener('drop', function(e){
        e.preventDefault(); dropzone.classList.remove('drag');
        handleFiles(e.dataTransfer.files);
      });
      fileInput.addEventListener('change', function(){
        handleFiles(fileInput.files);
        fileInput.value = '';
      });
    }

    app.querySelectorAll('[data-remove-attach]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-remove-attach');
        state.pendingAttachments = state.pendingAttachments.filter(function(a){ return a.id!==id; });
        if(state.editingTask && (state.editingTask.attachments||[]).some(function(a){return a.id===id;})){
          state.removedAttachmentIds.push(id);
        }
        render();
      });
    });

    app.querySelectorAll('[data-download-attach]').forEach(function(el){
      el.addEventListener('click', async function(){
        var id = el.getAttribute('data-download-attach');
        var pending = state.pendingAttachments.find(function(a){return a.id===id;});
        if(!pending) return;
        if(pending.dataUrl){ triggerDownload(pending.dataUrl, pending.name); return; }
        try{
          var res = await window.storage.get('attachment:'+id, true);
          if(res && res.value) triggerDownload(res.value, pending.name);
        }catch(e){
          showToast('No se pudo descargar el archivo.');
        }
      });
    });

    var saveBtn = document.getElementById('pm-save');
    if(saveBtn){
      saveBtn.addEventListener('click', async function(){
        var title = document.getElementById('pm-f-title').value.trim();
        if(!title){ showToast('Ponle un título a la tarea.'); return; }
        saveBtn.disabled = true; saveBtn.textContent = 'Guardando…';

        // persist any newly-added attachment contents to their own storage keys
        var newOnes = state.pendingAttachments.filter(function(a){ return a.isNew; });
        try{
          for(var i=0;i<newOnes.length;i++){
            await window.storage.set('attachment:'+newOnes[i].id, newOnes[i].dataUrl, true);
          }
          // clean up any attachments the user removed from an existing task
          for(var j=0;j<state.removedAttachmentIds.length;j++){
            await window.storage.delete('attachment:'+state.removedAttachmentIds[j], true);
          }
        }catch(e){
          showToast('Hubo un problema guardando los adjuntos.');
        }

        var attachmentsMeta = state.pendingAttachments.map(function(a){
          return {id:a.id, name:a.name, size:a.size, type:a.type};
        });

        var data = {
          title: title,
          desc: document.getElementById('pm-f-desc').value.trim(),
          assignee: document.getElementById('pm-f-assignee').getAttribute('data-value'),
          status: document.getElementById('pm-f-status').value,
          priority: document.getElementById('pm-f-priority').value,
          due: document.getElementById('pm-f-due').value,
          start: document.getElementById('pm-f-start').value,
          attachments: attachmentsMeta,
        };
        var estDurRaw = parseInt(document.getElementById('pm-f-estdur').value, 10);
        data.estDuration = (isFinite(estDurRaw) && estDurRaw>0) ? estDurRaw : null;
        if(data.start && data.due && data.start > data.due){
          var swapTmp = data.start; data.start = data.due; data.due = swapTmp;
          showToast('Ajustamos el orden de las fechas.');
        }
        if(state.editingTask){
          Object.assign(state.editingTask, data);
          showToast('Tarea actualizada');
        } else {
          data.id = uid();
          state.tasks.push(data);
          showToast('Tarea creada');
        }
        state.modalOpen=false; state.editingTask=null;
        state.pendingAttachments=[]; state.removedAttachmentIds=[];
        render();
        saveTasks();
      });
    }

    var delBtn = document.getElementById('pm-delete');
    if(delBtn){
      delBtn.addEventListener('click', async function(){
        var toDelete = state.editingTask;
        state.tasks = state.tasks.filter(function(t){return t.id!==toDelete.id;});
        state.modalOpen=false; state.editingTask=null;
        state.pendingAttachments=[]; state.removedAttachmentIds=[];
        showToast('Tarea eliminada');
        render();
        saveTasks();
        // clean up its attachment blobs so storage doesn't accumulate orphans
        var atts = toDelete.attachments || [];
        for(var i=0;i<atts.length;i++){
          try{ await window.storage.delete('attachment:'+atts[i].id, true); }catch(e){}
        }
      });
    }
  }

  init();
})();
</script>
